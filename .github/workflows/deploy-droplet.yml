# Tell the droplet (bj-box) that this repo's main moved.
#
# This repo is on the droplet's production list (Software-Factory
# droplet/repos.txt): the box keeps a checkout of its main. This workflow runs
# NOTHING on the box and checks nothing out. On a GitHub-hosted runner it asks
# Software-Factory to run its deploy workflow, the one workflow that runs on
# the box's single self-hosted runner, which fast-forwards every prod checkout
# to main. Software-Factory droplet/README.md ("Deploy") has the whole chain.
#
# DROPLET_DEPLOY_TOKEN is a fine-grained PAT: Software-Factory only, Actions
# read and write, nothing else. It can start that one workflow and cannot
# change any code. Without it this job warns and succeeds: Software-Factory's
# hourly catch-up deploys the box anyway, just later.
#
# Push to main and manual dispatch only. Never pull_request: a PR must not be
# able to deploy anything.
name: deploy droplet

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  dispatch:
    name: ask Software-Factory to deploy bj-box
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch Software-Factory's deploy workflow
        env:
          TOKEN: ${{ secrets.DROPLET_DEPLOY_TOKEN }}
          FROM_REPO: ${{ github.repository }}
          FROM_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN}" ]; then
            echo "::warning title=DROPLET_DEPLOY_TOKEN is not set::Not dispatching. Software-Factory's hourly catch-up will deploy this push to bj-box."
            exit 0
          fi
          body="$(jq -nc --arg repo "${FROM_REPO}" --arg sha "${FROM_SHA}" \
            '{ref: "main", inputs: {repo: $repo, sha: $sha}}')"
          curl --fail-with-body --silent --show-error --max-time 30 --retry 3 \
            -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/BenJerrysUpenn/Software-Factory/actions/workflows/deploy-droplet.yml/dispatches \
            --data "${body}"
          echo "Dispatched Software-Factory deploy-droplet.yml for ${FROM_REPO}@${FROM_SHA}"
