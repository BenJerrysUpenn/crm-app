# Copy to .github/workflows/agent-reviews.yml in a reviewed repo (bj-finance #585).
# It fires the factory review pass; the logic lives in Software-Factory.
name: agent review
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read # the loop guard reads the head commit's message
jobs:
  review:
    uses: BenJerrysUpenn/Software-Factory/.github/workflows/agent-review.yml@main
    secrets:
      ARCHITECTURE_REVIEWER_FIRE_TOKEN: ${{ secrets.ARCHITECTURE_REVIEWER_FIRE_TOKEN }}
