# What the factory review pass grades a pull request in this repository against
# (bj-finance #585; previously the three #452 reviewers, rollout #496).
#
# THIS FILE IS HOW THIS REPOSITORY OPTS IN. The review pass is one cloud routine
# shared across the portfolio, fired by .github/workflows/agent-reviews.yml, a
# copy of Software-Factory's docs/agents/review/caller-template.yml that calls
# Software-Factory's reusable .github/workflows/agent-review.yml@main. The pass
# reads this file from this repo's origin/main. No file, no review. Schema and
# deployment: Software-Factory docs/routines/reviewers.md.
#
# Maintainer information, not reviewer output. A reviewer never reports what it read,
# never says a document is thin, and never mentions a gap. It cites rules and
# violations, or it approves silently.

architecture_ground_truth:
  - path: README.md
    note: >-
      104 lines: four real rules, the rest stack description and setup prose. :57 "Row
      Level Security enabled on every table in the public schema." :65 user accounts are
      created by hand under Authentication > Users with Auto Confirm User ticked — "No
      public sign-up page exists." :70-80 the stage write contract — a stage change
      writes stage, is_active (0 for the four terminal stages, else 1) and updated_at in
      a single update via buildStagePatch in lib/dealUpdate.ts, and a move into Booked
      Paid also sets payment_status to Deposit Paid when the row had none. :82-85 the
      app does NOT write deals.boomerang_reason — writing it would make every stage
      change fail, and nothing in the app reads it either (bj-finance #466); the most
      directly gradeable rule in the file. :91 the board loads archived = 0 rows only.
      Everything else — stack, env vars, local dev, deploy — is description, not
      constraint.
  - path: docs/call-desk.md
    note: >-
      557 lines. Not a rules file — a feature specification — but this is where the
      repo's real code-shaped constraints live, and they are the ones a diff here can
      actually violate. :45 prospect notes are append-only via RPC
      call_desk_append_note. :53 do NOT use the service-role key for the outreach
      tables; manager-only policies govern them — restated at :477-479, where the admin
      client in lib/supabase/admin.ts "is reached only after the sign-in check and all
      three" gates and "this is the only call-desk write that is not" manager-policy
      governed. :103 an unresolved consent state means the UI must nag until it is
      resolved. :245-247 the clear-flag RPC applies ONLY when mark_clear is passed, it
      refuses to clear a suppression it did not set, and it "must never un-flag anyone.
      The asymmetry is the point." :299 the block reason is re-computed server-side from
      call_desk_queue, never from the client, and the route answers 409 when it is
      non-null. :320 lost must never be conflated with a suppression. :447 the recording
      upload consent gate is a hard requirement. :455-492 the undo and double-call
      guard. :529 write semantics for the guided deal form must match
      modules/db.py::create_deal in Catering-Manager, including is_outdoor never NULL.
  - path: docs/call-desk-do-not-call-policy.md
    note: >-
      175 lines of legal policy. MOST OF IT IS POLICY FOR A PERSON MAKING A CALL, NOT A
      CONSTRAINT ON A TYPESCRIPT DIFF, and cannot be violated by code — :82-90 (any
      wording on any channel means stop; do not rebut, do not offer a discount, do not
      ask why), :105 (the suppression list must never be used as a marketing list) and
      :128 (a registry-listed residential number must not be dialled) govern conduct.
      The subset a diff CAN violate is real but narrow: :32 who may be called and the
      31-day scrub window; :37-38 the warm window is measured on what the prospect DID,
      never on what we sent; :41 Pennsylvania allows only 12 months (73 P.S. 2245) and
      PA is the tighter rule; :51 never on a US federal legal holiday, and the 9am-7pm
      Mon-Sat window, both of which are lib/ date arithmetic; :99 suppression entries
      never expire; :109-117 out-of-window numbers may only be dialled after a scrub
      against BOTH registries and only for 31 days after it, and a partial file never
      clears anyone; :140 recordings only with spoken consent (Pennsylvania is
      all-party) and a five-year retention. Cite the narrow subset or drop the finding.

documentation_reference: README.md

# Which documents describe which code, for the documentation lens of the factory
# review pass (bj-finance #585; schema: Software-Factory docs/routines/reviewers.md).
# Globs match like git's `:(glob)` pathspec: `*` stays inside one directory, `**`
# crosses them. A changed path takes the docs of EVERY entry it matches.
documentation_map:
  - paths: [app/**, components/**, lib/**, scripts/**, middleware.ts, next.config.js, package.json, .env.example]
    docs: [README.md]
  - paths:
      - app/call-desk/**
      - app/api/call-desk/**
      - components/callDesk/**
      - lib/callDesk/**
      - supabase/crm/001_call_desk.sql
      - supabase/crm/002_call_desk_history.sql
      - supabase/crm/003_call_desk_compliance.sql
      - supabase/crm/004_call_desk_perf.sql
    docs: [docs/call-desk.md]
  - paths: [lib/callDesk/compliance.ts, app/call-desk/dnc-import/**, app/api/call-desk/dnc/**, supabase/crm/003_call_desk_compliance.sql]
    docs: [docs/call-desk-do-not-call-policy.md]
  - paths: [app/api/unsubscribe/**, lib/outreach/**, supabase/crm/005_unsubscribe.sql]
    docs: [docs/unsubscribe.md]
  - paths:
      - app/deals/**
      - app/api/deals/**
      - components/NewDealForm.tsx
      - lib/dealIntake.ts
      - lib/dealAutofill.ts
      - lib/dealDedupe.ts
      - lib/callDesk/dealCreate.ts
      - lib/callDesk/dealForm.ts
      - lib/callDesk/dealRequest.ts
      - supabase/crm/006_manual_deal_intake.sql
    docs: [docs/manual-deal-intake.md]
  - paths: [supabase/crm/backfills/**]
    docs: [supabase/crm/backfills/README.md]
  - paths: [time-app/**]
    docs: [time-app/SETUP-GUIDE.md]
  - paths: [time-app/app/api/cron/missed-clockins/**]
    docs: [time-app/ALEX-CRON-SETUP.md]
  - paths: [time-app/lib/payroll/**, time-app/app/api/payroll/**, time-app/supabase/migration_25*.sql, time-app/supabase/migration_26*.sql, time-app/supabase/migration_27*.sql, time-app/supabase/migration_28*.sql]
    docs: [docs/payroll-verify.md]
  - paths: [indeed-cv-downloader/**]
    docs: [indeed-cv-downloader/README.md]
  - paths: [.github/workflows/agent-reviews.yml, docs/agents/reviewers.yaml]
    docs: [docs/agents/reviewers.yaml]   # its header above; a gate file, so findings are questions

# Extra one-way globs for merge_danger.py, beyond Software-Factory's built-in
# list. This repo's migrations do NOT live under a `migrations/` directory: they
# are supabase/crm/*.sql and time-app/supabase/migration_*.sql, which the
# built-in list catches only through `**/*.sql`. The two directories are listed
# whole so a non-.sql file there (supabase/crm/backfills/*.py writes the live
# hosted database) is one-way too. Money-movement paths are built-in already. The
# call-desk do-not-call gate and the one-click unsubscribe decide who may
# legally be called or mailed: a call or a mail made while they are wrong
# cannot be recalled by a revert.
one_way_paths:
  - supabase/**
  - time-app/supabase/**
  - lib/callDesk/compliance.ts
  - app/api/call-desk/dnc/**
  - app/api/unsubscribe/**
  - lib/outreach/unsubscribe*.ts

# This repository's agent-reviews.yml calls the factory review pass (#585), so
# the review-wait hook waits for its `factory-review:` summary.
review_pipeline: factory

deploy_notes: >-
  This repository deploys through Vercel previews: every branch gets a preview URL, the
  previews are SSO-gated with no CLI path, and end-to-end checks on a preview are
  Alina's, not an agent's. Nothing under docs/ is imported by the Next.js build or read
  at runtime, so a docs-only merge is harmless. THIS REPO HAS NO DETERMINISTIC GATE
  STACK: package.json defines lint, typecheck and test scripts but nothing in CI ran
  them before this file landed, so "CI green first" here means the Vercel build plus
  whatever checks the repo actually has. That does not change the merge rule —
  deterministic checks first, reviewer approvals advisory. Supabase migrations under
  supabase/ are applied to a hosted project, so a migration that lands is live for every
  viewer at once. A push to main also fast-forwards a CHECKOUT of this repo on the
  droplet (bj-box, ~bjservice/code/crm-app): .github/workflows/deploy-droplet.yml only
  dispatches Software-Factory's deploy workflow. Nothing is built, installed or run from
  that checkout; it is staged for the system-BOM migration, and Vercel stays production.

language_notes: >-
  A Next.js / TypeScript application, with Python and PLpgSQL alongside it (Supabase
  migrations and RPCs in supabase/, the time-app, the Indeed CV downloader). Nothing
  about any rule changes with the language: cite a written sentence and a changed line.
  The practical point is WHERE the written rules bite — they are concentrated in the
  Supabase access layer (RLS, the service-role key, the RPCs), the call-desk route
  handlers and the stage-write path, not in component rendering, styling or hooks. A
  diff in components/ will usually draw an empty approval, and that is correct. One
  performance convention worth knowing while reading a migration: RLS policies in this
  project wrap the helper as (select is_manager()), never bare is_manager() — but that
  sentence is written in bj-finance docs/agents/system-bom.md, not here, so it is NOT in
  this repo's ground truth and cannot be cited against a diff here.

exclusions:
  - path: docs/unsubscribe.md
    why: >-
      Reference prose for one flow. The strongest candidate for promotion into the
      ground truth, since one-click unsubscribe is a legal obligation — but #496 named
      three documents and a reviewer never widens its own closed set. Promoting it is a
      human's edit to this file.
  - path: CATERING-CRON-SETUP.md
    why: A one-time operator setup guide.
  - path: time-app/SETUP-GUIDE.md
    why: A one-time operator setup guide for a separate application in this repo.
  - path: time-app/ALEX-CRON-SETUP.md
    why: A one-time operator setup guide.
  - path: indeed-cv-downloader/README.md
    why: A walkthrough for a standalone side tool.
  - path: supabase/crm/backfills/README.md
    why: A record of one-off backfills already run, not a constraint on new code.
